# Codemagic CI/CD Configuration for TestFlight Build & Distribution
# Documentation: https://docs.codemagic.io/flutter-code-signing/ios-code-signing/

workflows:
  ios-testflight:
    name: iOS TestFlight Release Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: ebazor_codemagic_api_key
    environment:
      ios_signing:
        distribution_type: app_store # For TestFlight
        bundle_identifier: com.ebozor.app # Your iOS Bundle ID
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Disable experimental Swift Package Manager
        script: |
          flutter config --no-enable-swift-package-manager
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Generate iOS configs and install CocoaPods dependencies
        script: |
          set -e
          flutter pub get
          flutter precache --ios
          if [ ! -s ios/Flutter/Generated.xcconfig ]; then
            echo "Flutter did not generate ios/Flutter/Generated.xcconfig"
            exit 1
          fi
          (
            cd ios
            pod update razorpay-pod razorpay-core-pod --repo-update
          )
      - name: Flutter build iOS (.ipa)
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true # Automatically sends to all Internal Testers
      email:
        recipients:
          - karthikn11092001@gmail.com # Replace with your email to receive build download link
        notify:
          success: true
          failure: true
