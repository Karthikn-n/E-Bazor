# Codemagic CI/CD Configuration for iOS Ad-Hoc Build (Loadly.io Distribution)
# Documentation: https://docs.codemagic.io/flutter-code-signing/ios-code-signing/

workflows:
  ios-ad-hoc:
    name: iOS Ad-Hoc Release Build (For Loadly.io)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: ebazor_codemagic_api_key # Matches the key name you save in Codemagic Integrations > Apple Developer Portal
    environment:
      ios_signing:
        distribution_type: ad_hoc # Creates an Ad-Hoc provisioning profile containing all registered test devices
        bundle_identifier: com.app.ebazar # Your iOS Bundle ID
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Get Flutter dependencies
        script: |
          flutter packages pub get
      - name: Install CocoaPods dependencies
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Flutter build iOS (.ipa)
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      email:
        recipients:
          - karthikn11092001@gmail.com # Replace with your email to receive build download link
        notify:
          success: true
          failure: true
