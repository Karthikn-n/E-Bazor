# Codemagic CI/CD Configuration for iOS Ad-Hoc Build (Loadly.io Distribution)
# Documentation: https://docs.codemagic.io/flutter-code-signing/ios-code-signing/

workflows:
  ios-ad-hoc:
    name: iOS Ad-Hoc Release Build (For Loadly.io)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      ios_signing:
        distribution_type: ad_hoc # Matches the uploaded Ad-Hoc profile for com.ebozor.app
        bundle_identifier: com.ebozor.app # Your iOS Bundle ID
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Disable experimental Swift Package Manager
        script: |
          flutter config --no-enable-swift-package-manager
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Generate iOS configs & get Flutter dependencies
        script: |
          rm -f ios/Flutter/Generated.xcconfig
          rm -f ios/Flutter/flutter_export_environment.sh
          flutter packages pub get
          flutter precache --ios
          flutter build ios --config-only --release --no-codesign
      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install --repo-update && cd ..
      - name: Flutter build iOS (.ipa)
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      email:
        recipients:
          - karthikn11092001@gmail.com # Replace with your email to receive build download link
        notify:
          success: true
          failure: true
